name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (e.g. v0.51.0-11)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125"

      - uses: gradle/actions/setup-gradle@v4

      # The native engine (libopenmw.so + runtime assets) is built locally with
      # source/tools/build-openmw-051-runtime.ps1 and uploaded once with
      # source/tools/pack-native-payload.ps1 to the "native-payload" release.
      - name: Download native payload
        run: |
          gh release download native-payload --pattern native-payload.zip --repo "$GITHUB_REPOSITORY"
          unzip -q native-payload.zip -d source/

      - name: Build release APK (mainline)
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleMainlineRelease

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK=$(ls source/app/build/outputs/apk/mainline/release/*.apk | head -n1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            KS=release.jks; PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; KPASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: signing with a throwaway key (updates over an older install will fail)."
            keytool -genkeypair -keystore release.jks -storepass android -keypass android \
              -alias key -dname "CN=OpenMW Android" -keyalg RSA -keysize 2048 -validity 10000
            KS=release.jks; PASS=android; ALIAS=key; KPASS=android
          fi
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" \
            --key-pass "pass:$KPASS" --out OpenMW-Android.apk aligned.apk
          "$BT/apksigner" verify OpenMW-Android.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          PRE=""
          if [ -z "$TAG" ]; then
            TAG="build-${{ github.run_number }}"
            PRE="--prerelease"
          fi
          NAME="OpenMW-Android-${TAG}.apk"
          mv OpenMW-Android.apk "$NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAME" --clobber
          else
            gh release create "$TAG" "$NAME" --title "$TAG" $PRE --generate-notes --target "$GITHUB_SHA"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: OpenMW-Android-*.apk
